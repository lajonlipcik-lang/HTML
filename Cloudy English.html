[data-lv=A2] .amb u{top:0!important;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),rgba(255,255,255,.08));animation:bub 10s ease-in infinite}

[data-lv=A1] .en{animation:float 3s ease-in-out infinite}[data-lv=A2] .en{animation:bnc 1.5s ease-in-out infinite}[data-lv=B1] .en{animation:glw 2s infinite}[data-lv=B2] .en{animation:glw 3s infinite}

/* Animated flag in the chat header */
.chat-flag {

  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  animation: flagWave 3s ease-in-out infinite alternate;
  transform-origin: left center;
  flex: none;
}
@keyframes flagWave {
  0% { transform: scale(1) rotate(0deg); }
  50% { transform: scale(1.04) rotate(-2deg); }
  100% { transform: scale(1) rotate(2deg); }
}

/* Cloudy centered in the chat header */

  justify-content: center;
  gap: 8px;
}

}

/* Moving dark-blue outline around the message input */
.chat-composer-box {
  position: relative;
  flex: 1;
  min-width: 0;
  border-radius: 18px;
  padding: 2px;
  background: rgba(255,255,255,0.08);
  overflow: hidden;
  display: flex;
}
.chat-composer-box::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: conic-gradient(
    transparent,
    transparent 65%,
    #0f2b6e 80%,
    #1f6fe0 92%,
    #6cc6ff 97%,
    transparent 100%
  );
  animation: rotateBorder 3.5s linear infinite;
  pointer-events: none;
}
@keyframes rotateBorder {
  to { transform: rotate(360deg); }
}
.chat-composer-box input {
  position: relative;
  z-index: 1;
  width: 100%;
  margin: 0;
  padding: 13px 16px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.14);

  color: inherit;
  font: inherit;
  font-size: 16px;
  outline: 0;

}

.study-screen,.exam-screen{overflow-x:hidden}

/* Keep the first Cloudy screen stable on mobile GPUs.
   Navigation and lesson-stage transitions remain available; decorative
   entrance loops and staggered card animations do not run during rendering. */
.scr:not(.tab-screen){animation:none!important}
.scr.tab-screen{animation:cloudyTabEnter .24s cubic-bezier(.2,.75,.25,1) both}
.nw,.ban{animation:none!important}
.ring,.tip,.amb u{animation:none!important}
.vocab-card,.pronoun-card,.grammar-example-card{animation:none!important}
.study-stage-enter,.study-stage.is-leaving,.exam-question-stage,.exam-question-stage.is-leaving{filter:none!important}
.scr:has(.stats) .ban,
.scr:has(.stats) .exam-home{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

/* Cloudy Shorts visual refinement: mascot reactions and TikTok-style comments */
.shorts-brand{gap:8px}.shorts-brand .ms{width:30px;height:25px;filter:drop-shadow(0 2px 5px rgba(50,160,255,.4))}
.shorts-brand-mark{display:none}
.shorts-search{display:grid;place-items:center;width:34px;height:34px}
.shorts-svg{width:25px;height:25px;display:block}
.shorts-action-icon{display:grid;place-items:center;width:34px;height:34px}
.shorts-action-icon .shorts-svg{width:29px;height:29px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.4))}
.shorts-like{gap:1px}
.shorts-cloud-like{display:grid;place-items:center;width:44px;height:42px;transition:transform .22s cubic-bezier(.2,1.6,.4,1)}
.shorts-cloud-like .ms{width:45px;height:37px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.38));transition:filter .25s}
.shorts-like .shorts-cloud-like .ms path:first-child{fill:#fff;stroke:rgba(13,40,80,.12);stroke-width:1}
.shorts-like.liked .shorts-cloud-like .ms path:first-child{fill:#78caff;stroke:#d7f2ff;stroke-width:1.4}
.shorts-cloud-like.cloud-pop{animation:cloudLikePop .48s cubic-bezier(.18,1.45,.35,1)}
@keyframes cloudLikePop{0%{transform:scale(.62) rotate(-12deg)}48%{transform:scale(1.28) rotate(7deg)}72%{transform:scale(.92) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
.shorts-action.liked small{color:#9cddff}

/* Cloudy Shorts — responsive motion and tactile feedback */
.shorts-feed{scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scroll-snap-type:y mandatory;overscroll-behavior-y:contain}
.shorts-video{scroll-snap-align:start;scroll-snap-stop:always;transition:opacity .28s ease,filter .28s ease}
.shorts-action{transition:transform .18s cubic-bezier(.2,.8,.2,1),opacity .18s ease,background-color .2s ease,color .2s ease}
.shorts-action:active{transform:scale(.88)}
.shorts-like .shorts-cloud-like{display:inline-flex;transform-origin:50% 65%;transition:transform .22s cubic-bezier(.2,.8,.2,1),filter .22s ease}
.shorts-like .shorts-cloud-like.cloud-pop{animation:shortsLikePop .42s cubic-bezier(.16,1.35,.35,1) both}
@keyframes shortsLikePop{0%{transform:scale(.68)}45%{transform:scale(1.28)}72%{transform:scale(.94)}100%{transform:scale(1)}}
.shorts-post-menu{transform-origin:bottom right;animation:shortsMenuIn .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes shortsMenuIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.shorts-caption{transition:opacity .24s ease,transform .24s ease}
@media(prefers-reduced-motion:reduce){.shorts-feed{scroll-behavior:auto}.shorts-video,.shorts-action,.shorts-like .shorts-cloud-like,.shorts-caption{transition:none!important;animation:none!important}}

/* Shorts comments sheet: larger touch target and native drag gesture. */
.shorts-comments-grabber{padding:12px 40px!important;margin:0 auto 2px!important;box-sizing:content-box;cursor:grab;touch-action:none;}
.shorts-comments-grabber:active{cursor:grabbing}

/* ==========================================================================
   Cloudy UI — redesign layer (loaded after cloudy-english.css)
   Main app: Duolingo-style path + HUD + floating dock.  Shorts: TikTok-style.
   ========================================================================== */

/* ---------- tokens ---------- */
@property --bg0{syntax:"<color>";inherits:true;initial-value:#050d2b}
@property --bg1{syntax:"<color>";inherits:true;initial-value:#0a2a73}
@property --bg2{syntax:"<color>";inherits:true;initial-value:#3aa0ff}
@property --a1{syntax:"<color>";inherits:true;initial-value:#4db3ff}
@property --a2{syntax:"<color>";inherits:true;initial-value:#2d86f2}
@property --a3{syntax:"<color>";inherits:true;initial-value:#1a58b5}

:root{
  --font:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg0:#050d2b;--bg1:#0a2a73;--bg2:#3aa0ff;
  --a1:#4db3ff;--a2:#2d86f2;--a3:#1a58b5;
  --dock-h:64px;
  --hud-h:calc(64px + env(safe-area-inset-top,0px));
  --ease-spring:cubic-bezier(.3,1.4,.5,1);
  --ease-out:cubic-bezier(.2,.85,.25,1);
  padding-top:0;
  transition:--bg0 .7s,--bg1 .7s,--bg2 .7s,--a1 .5s,--a2 .5s,--a3 .5s;
}
html[data-accent="mint"]{--bg0:#031d17;--bg1:#0a5c46;--bg2:#34d9a3;--a1:#3ddc97;--a2:#10a56a;--a3:#0a7a4d}
html[data-accent="sunset"]{--bg0:#1d0a1f;--bg1:#6a1f4d;--bg2:#ff8f5e;--a1:#ff9a5c;--a2:#f0562e;--a3:#b53a1a}
html[data-accent="grape"]{--bg0:#0d0a2b;--bg1:#3a1f87;--bg2:#9b6cff;--a1:#b58cff;--a2:#7a49f0;--a3:#5430b8}

html body,button,input,textarea,select{font-family:var(--font)}
body{background:linear-gradient(165deg,var(--bg0) 0%,var(--bg1) 48%,var(--bg2) 100%) fixed;letter-spacing:.005em}
h1,h2,h3,.big2,.btn,.opt,b{font-weight:900}
.chat-shell{background:linear-gradient(165deg,var(--bg0) 0%,var(--bg1) 48%,var(--bg2) 100%)}
.sw.on{background:var(--a1)}
.scr{padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(var(--dock-h) + 44px + env(safe-area-inset-bottom,0px));overflow-x:clip}
.scr.tab0{padding-top:0}
.card{border-radius:22px;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.12)}
.toast{border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}

/* staggered entrance for stacked cards */
.scr.tab1>*,.scr.tab2>*,.scr.tab3>*{animation:rise2 .55s var(--ease-out) both;animation-delay:calc(var(--k,0)*55ms)}
.scr.tab1>:nth-child(2),.scr.tab2>:nth-child(2),.scr.tab3>:nth-child(2){--k:1}
.scr.tab1>:nth-child(3),.scr.tab2>:nth-child(3),.scr.tab3>:nth-child(3){--k:2}
.scr.tab1>:nth-child(4),.scr.tab2>:nth-child(4),.scr.tab3>:nth-child(4){--k:3}
.scr.tab1>:nth-child(5),.scr.tab2>:nth-child(5),.scr.tab3>:nth-child(5){--k:4}
.scr.tab1>:nth-child(6),.scr.tab2>:nth-child(6),.scr.tab3>:nth-child(6){--k:5}
.scr.tab1>:nth-child(n+7),.scr.tab2>:nth-child(n+7),.scr.tab3>:nth-child(n+7){--k:6}

/* page heading used on Quests / League / Profile */
.pg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.pg-head h2{margin:0;font-size:28px;line-height:1.1}

/* ---------- HUD (Learn) ---------- */
.hud{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:8px;height:var(--hud-h);
  margin:0 -18px;padding:env(safe-area-inset-top,0px) 16px 0;
  background:linear-gradient(180deg,rgba(5,13,43,.9),rgba(5,13,43,.66));
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  border-bottom:1px solid rgba(255,255,255,.08)}
.hud .sp{flex:1}
.hud-lv{border:0;background:none;padding:0}
.hud-lv .lc{width:44px;height:44px;border-radius:14px;font-size:17px;animation:none;box-shadow:0 3px 0 #8fbfe8;transition:transform .25s var(--ease-spring)}
.hud-lv:active .lc{transform:scale(.9)}
.hud-stats{display:flex;gap:6px}
.stat{display:flex;align-items:center;gap:5px;height:38px;padding:0 12px 0 9px;border-radius:99px;background:rgba(255,255,255,.1);font-weight:900;font-size:16px}
.stat .i{font-size:22px}.stat.s-fl{color:#ffc46b}.stat.s-xp{color:#ffe27a}
.hud-goal{position:relative;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;padding:0;transition:transform .25s var(--ease-spring)}
.hud-goal svg{position:absolute;inset:0;width:100%;height:100%}
.hud-goal .t{fill:none;stroke:rgba(255,255,255,.2);stroke-width:3.6}
.hud-goal .p{fill:none;stroke:#ffd35a;stroke-width:3.6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .9s var(--ease-out)}
.hud-goal>.i{position:relative;font-size:22px;filter:grayscale(.7) opacity(.75);transition:filter .4s}
.hud-goal.rdy{animation:glow 1.6s infinite;background:rgba(138,99,255,.35)}
.hud-goal.rdy>.i{filter:none;animation:wob 1.2s infinite}
.hud-goal.got>.i{filter:none}.hud-goal.got .p{stroke:var(--ok)}
.hud-goal:active{transform:scale(.9)}
.hud-gear{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:24px;padding:0;color:#fff;transition:transform .6s var(--ease-spring),background .3s}
.hud-gear:active{transform:rotate(120deg) scale(.88);background:rgba(255,255,255,.2)}

.quick{display:flex;flex-wrap:wrap;gap:10px;padding:14px 0 0}
.rv-chip{display:flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:9px 16px 9px 12px;background:rgba(255,107,129,.2);border:1px solid rgba(255,107,129,.4);font-weight:900;font-size:14px;color:#ffb3c0;transition:transform .2s var(--ease-spring)}
.rv-chip .i{font-size:20px}.rv-chip:active{transform:scale(.94)}
.quick .exam-home{display:flex;align-items:center;gap:10px;flex:1 0 100%;margin:0;padding:10px 12px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.quick .exam-cloud .ms{width:44px;animation:none}
.quick .exam-copy{flex:1;min-width:0}.quick .exam-copy b{display:block;font-size:14px}
.quick .exam-copy small{display:block;font-size:11px;opacity:.75;line-height:1.25;font-weight:700}
.quick .exam-start{border:0;border-radius:12px;padding:9px 12px;font-weight:900;font-size:12px;background:#fff;color:#1f6fe0;box-shadow:0 3px 0 #8fbfe8;white-space:nowrap}
.quick .exam-start:disabled{background:rgba(255,255,255,.22);color:rgba(255,255,255,.75);box-shadow:none}

/* ---------- Learn path ---------- */
.unit{--u1:var(--a1);--u2:var(--a2);--us:var(--a3);margin-top:4px}
.unit.u1{--u1:#58e0a2;--u2:#1fb877;--us:#0f7f52}
.unit.u2{--u1:#b58cff;--u2:#7a49f0;--us:#5430b8}
.unit.u3{--u1:#ffb45c;--u2:#f2792e;--us:#b04e12}
.unit .ban{position:sticky;top:calc(var(--hud-h) + 8px);z-index:6;margin:14px 0 22px;border-radius:22px;overflow:hidden;
  background:linear-gradient(135deg,var(--u1),var(--u2));box-shadow:0 5px 0 var(--us),0 14px 28px rgba(0,0,0,.28)}
.unit .ban-t{flex:1;padding:14px 18px 16px;min-width:0}
.unit .ban small{font-weight:900;font-size:12px;letter-spacing:1.2px;opacity:.85}
.unit .ban h3{margin:2px 0 0;font-size:21px;line-height:1.15}
.ban-p{height:8px;border-radius:5px;background:rgba(0,0,0,.2);margin-top:12px;overflow:hidden}
.ban-p i{display:block;height:100%;border-radius:5px;background:#fff;transition:width 1s var(--ease-out)}
.unit .gd{width:62px;display:grid;place-items:center;font-size:28px;border:0;border-left:2px solid rgba(0,0,0,.16);background:rgba(0,0,0,.06);color:#fff;transition:background .25s}
.unit .gd:active{background:rgba(0,0,0,.18)}

.unit .path{gap:30px;padding:6px 0 34px}
.unit .nw{width:110px}
.unit .node{width:84px;height:84px;font-size:38px;background:linear-gradient(var(--u1),var(--u2));box-shadow:0 8px 0 var(--us),0 16px 24px rgba(0,0,0,.3)}
.unit .node:active{transform:translateY(7px);box-shadow:0 1px 0 var(--us)}
.unit .node.done{background:linear-gradient(#fff,var(--ice));color:var(--u2);box-shadow:0 8px 0 #8fbfe8,0 16px 24px rgba(0,0,0,.28)}
.unit .node.lock{background:rgba(120,140,185,.5);color:rgba(255,255,255,.5);box-shadow:0 8px 0 rgba(20,40,100,.55)}

.unit .node.cur:active{animation:none;transform:translateY(7px)}
.unit .node .ring{inset:-12px;width:120px;height:120px}
.unit .tip{top:-50px;color:var(--u2)}
.unit .lb{width:max-content;max-width:150px;margin:12px auto 0;font-size:13px;font-weight:800;line-height:1.15;opacity:.92;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.nw.lock .lb{opacity:.55}
.pal{position:absolute;top:2px;width:86px;pointer-events:none;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.pal.r{left:calc(50% + 62px)}.pal.l{right:calc(50% + 62px)}

.done-card{text-align:center}

/* AI practice FAB */
.fab-ai{position:fixed;z-index:7;right:max(14px,calc((100vw - 480px)/2 + 14px));bottom:calc(var(--dock-h) + 24px + env(safe-area-inset-bottom,0px));

/* ---------- Floating dock ---------- */
nav.dock{left:12px;right:12px;margin:0 auto;max-width:456px;bottom:calc(10px + env(safe-area-inset-bottom,0px));
  height:var(--dock-h);padding:6px;gap:0;align-items:stretch;border-radius:28px;
  background:rgba(8,22,64,.78);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);
  z-index:9;animation:dockIn .6s var(--ease-spring) both}
@keyframes dockIn{from{transform:translateY(40px);opacity:0}}
.dock-ind{position:absolute;z-index:0;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:22px;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
  transform:translateX(calc(var(--i,0)*100%));transition:transform .6s var(--ease-spring),opacity .3s}
nav.dock.mid-on .dock-ind{opacity:0}
nav.dock button{position:relative;z-index:1;flex:1;gap:1px;padding:6px 0 3px;font-size:25px;border-radius:22px;opacity:.6;background:none;transform:none;
  justify-content:center;transition:opacity .25s,transform .35s var(--ease-spring)}
nav.dock button span{font-size:10px;font-weight:800;letter-spacing:.2px}
nav.dock button.on{opacity:1;background:none;transform:none}
nav.dock button:active{transform:scale(.9)}
nav.dock button.on .i{animation:dockPop .5s var(--ease-spring)}
@keyframes dockPop{40%{transform:translateY(-4px) scale(1.18)}}
nav.dock .dock-mid{opacity:1}
.mid-bub{display:grid;place-items:center;width:54px;height:36px;border-radius:14px;font-size:21px;margin-top:-1px;
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 4px 0 var(--a3),0 8px 16px rgba(0,0,0,.3);transition:transform .35s var(--ease-spring)}
.dock-mid span:last-child{margin-top:2px;opacity:.85}
.dock-mid.on .mid-bub{transform:scale(1.1)}
.dock-mid.plus .mid-bub{background:#fff;color:#06143a;box-shadow:-4px 0 0 #25f4ee,4px 0 0 #fe2c55;border-radius:12px}
.dock-mid.plus .i{animation:none}

/* dark flat dock on the video tab */
nav.dock.dock-dark{left:0;right:0;bottom:0;max-width:480px;height:calc(var(--dock-h) + env(safe-area-inset-bottom,0px));
  padding:6px 6px env(safe-area-inset-bottom,0px);border-radius:0;border:0;border-top:1px solid rgba(255,255,255,.1);
  background:rgba(0,0,0,.78);box-shadow:none;animation:none}

/* ---------- Quests ---------- */
.streak-card{border-radius:26px;padding:16px 16px 14px;margin-bottom:14px;background:linear-gradient(135deg,rgba(255,181,46,.3),rgba(255,125,58,.16));border:1px solid rgba(255,211,90,.32)}
.sc-top{display:flex;align-items:center;gap:12px}
.sc-fl{font-size:50px;display:flex;animation:wob 1.6s infinite}
.sc-top b{display:block;font-size:36px;line-height:1}.sc-top small{font-weight:800;opacity:.85;font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.wd{display:grid;justify-items:center;gap:6px;animation:rise2 .5s both;animation-delay:calc(var(--i)*55ms + 250ms)}
.wd small{font-size:11px;font-weight:800;opacity:.75}

.chest-card,.rv-card{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:14px;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12)}
.chest-card .cc-ic{font-size:54px;display:flex;filter:grayscale(.8) opacity(.7);transition:filter .5s}
.chest-card .cc-b{flex:1;min-width:0}.chest-card b{display:block;font-size:17px}
.chest-card small,.rv-card small{display:block;opacity:.8;font-weight:700;margin:2px 0 8px;font-size:13px}
.chest-card .btn.sm{padding:11px 16px;font-size:14px}
.chest-card.rdy{background:linear-gradient(135deg,rgba(138,99,255,.5),rgba(90,53,216,.4));border-color:rgba(190,170,255,.5);animation:glow 1.8s infinite}
.chest-card.rdy .cc-ic,.chest-card.got .cc-ic{filter:none}.chest-card.rdy .cc-ic{animation:wob 1.2s infinite}
.chest-card.got{opacity:.75}
.rv-card{background:rgba(255,107,129,.16);border-color:rgba(255,107,129,.35)}.rv-card small{margin:2px 0 0}
.rv-ic{font-size:36px;display:flex;color:#ff9aab}

.quest-list{display:grid;gap:12px}
.qi{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);animation:rise2 .5s both;animation-delay:calc(var(--i)*80ms + 300ms);transition:background .4s}
.qi-ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:linear-gradient(var(--a1),var(--a2));box-shadow:0 4px 0 var(--a3);flex:none}

.qi.done .qi-ok{background:var(--ok);color:#fff;transform:scale(1.1)}
.qi.done .qi-ic{background:linear-gradient(#5be8b4,#1fb877);box-shadow:0 4px 0 #0f7f52}

/* ---------- League ---------- */
.lg-hero{display:flex;align-items:center;gap:16px;padding:18px;margin-bottom:14px;border-radius:26px;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.14)}

.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;gap:10px;margin:8px 0 18px}

.pod b{font-size:14px}.pod small{font-size:12px;opacity:.85;font-weight:800;margin-bottom:6px}
.pod-bar{width:100%;border-radius:16px 16px 0 0;display:grid;place-items:start center;padding-top:8px;font-weight:900;font-size:24px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.08))}

.rk{display:inline-block;width:30px}
.lr.me{border-radius:14px;background:rgba(255,255,255,.2)}

/* ---------- Profile ---------- */
.hero{display:flex;align-items:center;gap:14px;padding:18px;margin-bottom:12px;border-radius:28px;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 5px 0 var(--a3),0 14px 28px rgba(0,0,0,.25)}
.hero-ms .ms{width:96px;animation:float 3s ease-in-out infinite}

.hero .lc{display:inline-block;width:auto;height:auto;padding:4px 14px;border-radius:10px;font-size:15px;animation:none}
.menu-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;margin-bottom:14px;border-radius:22px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.1);color:inherit;transition:transform .2s var(--ease-spring),background .25s}

.top{gap:12px;align-items:center}
.bar{height:18px;border-radius:10px}

.opt{border-radius:20px;padding:16px 18px;box-shadow:0 4px 0 rgba(255,255,255,.14)}

.btn{border-radius:18px;font-weight:900}

.res .ms{width:140px;animation:float 3s ease-in-out infinite}
.fm input,.cin input,.chat-composer input{border-radius:18px}

/* ---------- Shorts: TikTok-style ---------- */
.scr.tab4{padding:0 0 calc(var(--dock-h) + env(safe-area-inset-bottom,0px))!important;height:100svh;min-height:100svh;overflow:hidden;animation:none}
.scr.tab4 .shorts-screen{height:calc(100svh - var(--dock-h) - env(safe-area-inset-bottom,0px))!important;max-width:480px;margin:0 auto}
.shorts-topbar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:0;
  padding:calc(6px + env(safe-area-inset-top,0px)) 10px 12px;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent)}
.shorts-brand{justify-self:start}
.tt-logo{display:block;width:38px;animation:float 3.2s ease-in-out infinite}.tt-logo .ms{width:100%;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.shorts-tabs{justify-self:center;gap:22px}
.shorts-tabs button{font-size:17px;font-weight:900;padding:8px 2px;color:rgba(255,255,255,.62);text-shadow:0 1px 8px rgba(0,0,0,.55);transition:color .3s}
.shorts-tabs button.active{color:#fff}
.shorts-tabs button.active:after{left:28%;right:28%;bottom:0;height:3px;border-radius:3px;background:#fff;animation:ttLine .4s var(--ease-spring) both}
@keyframes ttLine{from{transform:scaleX(0)}}
.shorts-search{justify-self:end;width:42px;height:42px;display:grid;place-items:center;font-size:26px;color:#fff;padding:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.shorts-search .shorts-svg{width:1em;height:1em}
.shorts-create{display:none}

.shorts-actions{right:8px;bottom:22px;gap:16px}
.shorts-avatar-wrap{position:relative;margin-bottom:12px}
.shorts-author-avatar{width:48px;height:48px;margin:0;font-size:19px;border-width:2px}
.shorts-av-plus{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);width:22px;height:22px;border:0;border-radius:50%;padding:0;display:grid;place-items:center;
  background:linear-gradient(var(--a1),var(--a2));color:#fff;font-weight:900;font-size:16px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.4);animation:pop .5s .2s both}
.shorts-action{min-width:50px;gap:2px}
.shorts-action-icon{font-size:35px}
.shorts-svg{width:1em;height:1em;display:block;filter:drop-shadow(0 2px 5px rgba(0,0,0,.5))}
.shorts-cloud-like .ms{width:52px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.shorts-action small{font-size:12px;font-weight:800}
.shorts-action:active .shorts-action-icon,.shorts-action:active .shorts-cloud-like{transform:scale(.85)}
.shorts-action-icon,.shorts-cloud-like{transition:transform .2s var(--ease-spring)}
.shorts-disc{width:46px;height:46px;margin-top:4px;border-radius:50%;border:7px solid #151515;background:radial-gradient(circle,#2a3a70 40%,#0b1330 41%);display:grid;place-items:center;animation:spin 5s linear infinite;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.shorts-disc span{display:block;width:22px;height:22px}.shorts-disc .ms{width:100%;height:100%}
.shorts-video:not(.is-playing) .shorts-disc{animation-play-state:paused}

.shorts-caption{left:14px;right:84px;bottom:18px}
.shorts-author-line b{font-size:16px}.shorts-author-line>span{font-size:12px}
.shorts-follow{padding:5px 11px;border-radius:99px;font-size:11px;font-weight:900;border:1.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.1);transition:all .3s var(--ease-spring)}
.shorts-follow:active{transform:scale(.92)}
.shorts-caption p{font-size:14px;line-height:1.35;font-weight:600;margin:8px 0 6px}
.shorts-audio{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shorts-audio .shorts-svg{width:14px;height:14px;flex:none}

.shorts-prog{position:absolute;z-index:3;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.22)}
.shorts-prog i{display:block;height:100%;width:var(--p,0%);background:#fff;transition:width .3s linear}
body[data-prog="0"] .shorts-prog{display:none}

.tt-heart{position:absolute;z-index:6;width:104px;height:104px;margin:-52px 0 0 -52px;pointer-events:none;transform:rotate(var(--rot,0deg));
  animation:ttHeart .9s var(--ease-out) forwards;filter:drop-shadow(0 8px 16px rgba(255,60,100,.5))}
.tt-heart svg{width:100%;height:100%}
@keyframes ttHeart{0%{opacity:0;transform:rotate(var(--rot)) scale(.2)}18%{opacity:1;transform:rotate(var(--rot)) scale(1.18)}34%{transform:rotate(var(--rot)) scale(.96)}100%{opacity:0;transform:rotate(var(--rot)) translateY(-90px) scale(1.25)}}

/* ---------- Settings drawer ---------- */
body.sp-open{overflow:hidden}
.sp-root{position:fixed;inset:0;z-index:40}
.sp-scrim{position:absolute;inset:0;background:rgba(3,10,35,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .4s}
.sp-root.in .sp-scrim{opacity:1}
.sp-panel{position:absolute;top:0;right:0;bottom:0;width:min(92vw,420px);display:flex;flex-direction:column;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg1) 92%,#fff 8%),var(--bg0));border-radius:30px 0 0 30px;
  box-shadow:-24px 0 70px rgba(0,0,0,.5);padding-top:env(safe-area-inset-top,0px);
  transform:translateX(105%);transition:transform .55s var(--ease-out);will-change:transform;touch-action:pan-y}
.sp-root.in .sp-panel{transform:none}
.sp-root.out .sp-panel{transform:translateX(105%);transition-duration:.35s}
.sp-root.out .sp-scrim{opacity:0}
.sp-head{display:flex;align-items:center;gap:12px;padding:16px 16px 10px}
.sp-head h3{margin:0;flex:1;font-size:24px;font-weight:900}
.sp-x{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:20px;color:#fff;padding:0;transition:transform .25s var(--ease-spring)}
.sp-x:active{transform:rotate(90deg) scale(.88)}
.sp-grip{width:0}
.sp-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px calc(28px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
.sp-body::-webkit-scrollbar{display:none}
.sp-sec{margin-bottom:18px;animation:spIn .55s var(--ease-out) both;animation-delay:calc(var(--i)*70ms + 120ms)}
.sp-still .sp-sec{animation:none}
@keyframes spIn{from{opacity:0;transform:translateX(26px)}}
.sp-sec h4{display:flex;align-items:center;gap:8px;margin:0 0 8px 4px;font-size:13px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;opacity:.75}
.sp-sec h4 span{display:flex;font-size:18px}
.sp-card{padding:4px 14px;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.sp-block{padding:12px 0}.sp-block+.sp-block,.sp-block+.sp-row,.sp-row+.sp-row,.sp-row+.sp-link,.sp-link+.sp-link{border-top:1px solid rgba(255,255,255,.09)}
.sp-cap{margin:0 0 10px;font-size:12px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;opacity:.65}
.sp-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;font-weight:800;font-size:15px}
.sp-lab{display:flex;align-items:center;gap:10px;min-width:0}
.sp-range{width:150px;accent-color:var(--a1)}
.sp-card .ti{border-radius:12px;padding:8px 10px}

.sp-seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:4px;border-radius:16px;background:rgba(0,0,0,.26)}
.sp-seg-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:12px;background:#fff;box-shadow:0 3px 0 #8fbfe8;
  transform:translateX(calc(var(--i)*100%));transition:transform .5s var(--ease-spring)}
.sp-seg button{position:relative;z-index:1;border:0;background:none;padding:11px 4px;font-weight:900;font-size:14px;color:rgba(255,255,255,.8);transition:color .3s}
.sp-seg button.on{color:#1f6fe0}

.sp-swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sp-sw{display:grid;justify-items:center;gap:6px;padding:10px 2px 8px;border-radius:18px;border:2px solid transparent;background:rgba(255,255,255,.08);color:#fff;transition:all .35s var(--ease-spring)}
.sp-sw i{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 3px 0 rgba(0,0,0,.28)}
.sp-sw small{font-size:11px;font-weight:800}
.sp-sw.on{border-color:#fff;background:rgba(255,255,255,.16);transform:translateY(-3px)}
.sp-fonts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sp-font{display:grid;justify-items:center;gap:2px;padding:10px 2px 8px;border-radius:18px;border:2px solid transparent;background:rgba(255,255,255,.08);color:#fff;transition:all .35s var(--ease-spring)}
.sp-font b{font-size:28px;line-height:1.1;font-weight:800}.sp-font small{font-size:11px;font-weight:700;opacity:.85}
.sp-font.on{border-color:#fff;background:rgba(255,255,255,.16);transform:translateY(-3px)}

.sp-link{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 0;border:0;background:none;color:#fff;font-weight:800;font-size:15px;text-align:left}
.sp-link i{font-style:normal;font-size:24px;opacity:.5;transition:transform .25s var(--ease-spring)}
.sp-link:active i{transform:translateX(4px)}
.sp-link.danger{color:#ff9aab}
.sp-restore{display:block;margin:4px auto 0;padding:12px;border:0;background:none;color:rgba(255,255,255,.7);font-weight:800;font-size:13px;text-decoration:underline}

/* ---------- Motion preferences ---------- */
html[data-motion="calm"] .amb,html[data-motion="off"] .amb{display:none}
html[data-motion="calm"] *,html[data-motion="calm"] *::before,html[data-motion="calm"] *::after{animation-iteration-count:1!important}
html[data-motion="calm"] .nodeBeat,html[data-motion="calm"] .unit .node.cur{animation:none}
html[data-motion="off"] *,html[data-motion="off"] *::before,html[data-motion="off"] *::after{
  animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;
  transition-duration:.001ms!important;transition-delay:0s!important;scroll-behavior:auto!important}
html[data-motion="off"] .toast{animation:none;transform:translate(-50%,0)}
html[data-motion="off"] .tt-heart{display:none}
@media (prefers-reduced-motion:reduce){html[data-motion="full"] .amb{display:none}}

/* Cloudy Legal — документы простым языком */
.lgl-root{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;
  background:linear-gradient(165deg,var(--bg0,#050d2b) 0%,var(--bg1,#0a2a73) 100%);
  animation:lglIn .5s cubic-bezier(.2,.85,.25,1) both}
.lgl-root.out{animation:lglOut .32s ease both}
@keyframes lglIn{from{opacity:0;transform:translateY(48px)}}
@keyframes lglOut{to{opacity:0;transform:translateY(40px)}}
.lgl-in{position:relative;width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lgl-top{display:flex;align-items:center;gap:12px;padding:12px 16px 10px}
.lgl-top h3{margin:0;flex:1;font-size:19px;font-weight:900;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgl-back{width:42px;height:42px;flex:none;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;padding:0;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.lgl-back:active{transform:scale(.88)}
.lgl-prog{height:3px;background:rgba(255,255,255,.1);margin:0 16px;border-radius:3px;overflow:hidden}
.lgl-prog i{display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,var(--a1,#4db3ff),#fff);border-radius:3px;transition:width .15s linear}
.lgl-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:14px 16px calc(34px + env(safe-area-inset-bottom,0px))}
.lgl-scroll::-webkit-scrollbar{display:none}
.lgl-pg.fwd{animation:lglFwd .42s cubic-bezier(.2,.85,.25,1) both}
.lgl-pg.bck{animation:lglBck .42s cubic-bezier(.2,.85,.25,1) both}
@keyframes lglFwd{from{opacity:0;transform:translateX(36px)}}
@keyframes lglBck{from{opacity:0;transform:translateX(-36px)}}

/* hero */
.lgl-hero{text-align:center;padding:22px 18px 20px;margin-bottom:18px;border-radius:28px;background:linear-gradient(135deg,var(--a1,#4db3ff),var(--a2,#2d86f2));box-shadow:0 5px 0 var(--a3,#1a58b5),0 16px 30px rgba(0,0,0,.28)}
.lgl-hero-ic{font-size:50px;line-height:1;margin-bottom:8px;display:inline-block;animation:float 3s ease-in-out infinite}
.lgl-hero h2{margin:0 0 8px;font-size:24px;font-weight:900;line-height:1.15}
.lgl-hero p{margin:0;font-size:14px;line-height:1.45;font-weight:600;opacity:.92}
.lgl-h{margin:22px 4px 10px;font-size:13px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;opacity:.7}

/* FAQ + expanders */
.lgl-faq{display:grid;gap:8px}
.lgl-q{border-radius:18px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);overflow:hidden;animation:rise2 .5s both;animation-delay:calc(var(--i)*55ms + 120ms)}
.lgl-q>button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;border:0;background:none;color:#fff;font-weight:800;font-size:15px;text-align:left;line-height:1.3}
.lgl-q>button i{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-style:normal;font-size:18px;transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.lgl-q.open>button i{transform:rotate(135deg)}
.lgl-x{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.85,.25,1)}
.lgl-x>div{overflow:hidden;min-height:0}
.open>.lgl-x,.open .lgl-x{grid-template-rows:1fr}
.lgl-q .lgl-x p{margin:0;padding:0 16px 6px;font-size:14px;line-height:1.5;opacity:.92;font-weight:500}
.lgl-more{border:0;background:none;color:#8fd3ff;font-weight:800;font-size:13px;padding:6px 16px 14px}

/* document cards */
.lgl-cards{display:grid;gap:10px}
.lgl-card{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:22px;text-align:left;color:#fff;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);animation:rise2 .5s both;animation-delay:calc(var(--i)*60ms + 250ms);
  transition:transform .2s cubic-bezier(.3,1.4,.5,1),background .25s}
.lgl-card:active{transform:scale(.97);background:rgba(255,255,255,.15)}
.lgl-ic{flex:none;width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:27px;background:color-mix(in srgb,var(--h) 30%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--h) 55%,transparent)}
.lgl-ct{flex:1;min-width:0}.lgl-ct b{display:block;font-size:16px;line-height:1.2}
.lgl-ct small{display:block;margin-top:3px;font-size:12px;line-height:1.35;opacity:.72;font-weight:600}
.lgl-card em{flex:none;font-style:normal;font-size:11px;font-weight:900;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.12)}

/* support */
.lgl-support{display:flex;align-items:center;gap:14px;margin-top:22px;padding:14px 16px;border-radius:22px;text-decoration:none;color:#fff;
  background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.16);transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.lgl-support:active{transform:scale(.97)}
.lgl-sup-ic{font-size:30px}.lgl-support b{display:block;font-size:15px}.lgl-support small{display:block;opacity:.75;font-weight:600;font-size:12px;margin-top:2px}
.lgl-support>span:nth-child(2){flex:1}.lgl-support i{font-style:normal;font-size:26px;opacity:.55}

/* document view */
.lgl-dh{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.lgl-dh-ic{flex:none;width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-size:32px;background:color-mix(in srgb,var(--h) 30%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--h) 60%,transparent);animation:pop .5s both}
.lgl-dh h2{margin:0;font-size:22px;line-height:1.15;font-weight:900}
.lgl-dh p{margin:4px 0 0;font-size:13px;opacity:.75;font-weight:700;line-height:1.35}
.lgl-short{padding:16px;border-radius:26px;margin-bottom:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--h) 26%,transparent),rgba(255,255,255,.06));border:1px solid color-mix(in srgb,var(--h) 45%,transparent)}
.lgl-short-t{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:17px}.lgl-short-t span{font-size:22px}
.lgl-short ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.lgl-short li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.4;font-weight:700;animation:rise2 .45s both;animation-delay:calc(var(--i)*70ms + 150ms)}
.lgl-short li i{flex:none;width:22px;height:22px;border-radius:50%;margin-top:1px;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:900;background:var(--h);color:#06143a}
.lgl-toc{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.lgl-toc::-webkit-scrollbar{display:none}
.lgl-toc button{flex:none;border:0;border-radius:99px;padding:8px 13px;background:rgba(255,255,255,.1);color:#fff;font-weight:800;font-size:12.5px;white-space:nowrap;transition:background .25s,transform .2s}
.lgl-toc button:active{background:rgba(255,255,255,.22);transform:scale(.94)}
.lgl-sec{padding:15px 16px 10px;margin-bottom:10px;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);animation:rise2 .5s both;animation-delay:calc(var(--i)*50ms + 200ms)}
.lgl-sec.flash{animation:lglFlash 1s ease both}
@keyframes lglFlash{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 0 3px var(--h)}}
.lgl-sec-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.lgl-n{flex:none;min-width:28px;height:28px;padding:0 6px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:900;background:var(--h);color:#06143a}
.lgl-sec h4{margin:0;font-size:16px;line-height:1.25;font-weight:900}
.lgl-sec>p{margin:0;font-size:15px;line-height:1.55;font-weight:500;opacity:.95}
.lgl-sec a,.lgl-x a{color:#8fd3ff;word-break:break-all}
.lgl-ox{margin-top:8px}
.lgl-orig{display:flex;align-items:center;gap:6px;border:0;background:none;color:rgba(255,255,255,.65);font-size:12.5px;font-weight:800;padding:8px 0;letter-spacing:.3px}
.lgl-orig i{font-style:normal;font-size:16px;transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.lgl-ox.open .lgl-orig i{transform:rotate(180deg)}
.lgl-o{margin:0 0 10px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.22);font-size:13px;line-height:1.55;opacity:.85;font-weight:500}

html[data-motion="off"] .lgl-root,html[data-motion="off"] .lgl-root *{animation:none!important}

      paint(true);
    },
    motion: function (v) { API.set("motion", v); },
    lang: function (v) { P.lang = v; persist(); applyPrefs(); retranslateAll(); snd_("pick"); paint(true); },
    tog: function (k) {
      var s = S_(); if (!s) return;
      s.set[k] = s.set[k] ? 0 : 1; save_(); snd_("tap");
      if (k === "rem" && s.set.rem) { try { Notification.requestPermission(); } catch (e) {} }
      paint(true);
    },
    goal: function (v) { var s = S_(); if (!s) return; s.set.goal = +v; save_(); snd_("pick"); try { view(0); } catch (e) {} paint(true); },
    vol: function (v) { var s = S_(); if (!s) return; s.set.vol = +v; save_(); },
    remT: function (v) { var s = S_(); if (!s) return; s.set.remT = v; save_(); },
    ping: function () { snd_("ok"); },
    profile: function () { close(); try { tab(3); } catch (e) {} },
    reset: function () { close(); try { rst(); } catch (e) {} },
    restore: function () { Object.assign(P, DEFAULTS); persist(); applyPrefs(); retranslateAll(); snd_("pick"); paint(true); },
    heart: heartBurst
  };
  function save_() { try { save(); } catch (e) {} }
  window.CloudyUI = API;

  /* ---------- shorts gestures: progress bar + double-tap like ---------- */
  document.addEventListener("timeupdate", function (e) {
    var v = e.target;
    if (!v || !v.classList || !v.classList.contains("shorts-real-video") || !v.duration) return;
    var c = v.closest(".shorts-video"); if (c) c.style.setProperty("--p", (v.currentTime / v.duration * 100).toFixed(2) + "%");
  }, true);

  function heartBurst(x, y, host) {
    var h = document.createElement("div");
    h.className = "tt-heart"; h.style.left = x + "px"; h.style.top = y + "px";
    h.style.setProperty("--rot", ((Math.random() * 30) - 15).toFixed(1) + "deg");
    h.innerHTML = '<svg viewBox="0 0 24 24"><use href="#heart"/></svg>';
    host.appendChild(h); setTimeout(function () { h.remove(); }, 900);
  }
  var tapT = 0, tapX = 0, tapY = 0;
  document.addEventListener("pointerup", function (e) {
    if (!P.dbl) return;
    var card = e.target.closest && e.target.closest(".shorts-video");
    if (!card || e.target.closest(".shorts-actions,.shorts-caption,.shorts-topbar,button,a")) return;
    var now = Date.now(), dx = Math.abs(e.clientX - tapX), dy = Math.abs(e.clientY - tapY);
    if (now - tapT < 320 && dx < 40 && dy < 40) {
      tapT = 0;
      var r = card.getBoundingClientRect();
      heartBurst(e.clientX - r.left, e.clientY - r.top, card);
      var id = card.dataset.shortId, btn = card.querySelector(".shorts-like");
      if (id && btn && !btn.classList.contains("liked") && typeof shortsLike === "function") shortsLike(id);
    } else { tapT = now; tapX = e.clientX; tapY = e.clientY; }
  }, true);

<script>/* Cloudy Legal: переработанные юридические документы (простым языком + полный юридический текст). */
(function(){"use strict";
var DATA={"docs": [{"id": "terms", "icon": "📜", "hue": "#4db3ff", "title": "Пользовательское соглашение", "desc": "Условия использования Cloudy English Academy", "short": ["Регистрация с 13 лет; в 13–17 нужно согласие родителя там, где этого требует закон", "Профиль закрыт по умолчанию — что показывать, решаешь ты", "Cloudy AI — ИИ-помощник: он учит английскому и может ошибаться", "Нельзя перепродавать доступ, травить других и ломать сервис", "Возраст, email, удаление аккаунта и жалобы — через поддержку в Telegram"], "secs": [{"t": "1. О сервисе", "p": "Cloudy English Academy — приложение для самостоятельного изучения английского: уроки, упражнения, проверка ответов, прогресс и помощник Cloudy AI. Cloudy AI разбирает твои ошибки, подбирает задания и может сам предложить продолжить урок. Он общается по-русски, учит английскому и отвечает на вопросы о приложении; на посторонние темы не отвечает. И всегда честно говорит, что он ИИ, а не человек.", "o": "Cloudy English Academy — образовательная платформа для самостоятельного изучения английского языка. В приложении доступны учебные материалы, упражнения, проверка ответов, отслеживание прогресса и фирменный помощник Cloudy AI. Cloudy AI анализирует ошибки, учитывает предыдущие диалоги и учебный прогресс, подбирает задания и может самостоятельно инициировать разговор или предложить продолжить урок. Он общается на русском языке, обучает английскому и отвечает на вопросы о приложении; посторонние темы не входят в его специализацию. Помощник адаптирует объяснения к возрасту и уровню, сохраняет дружелюбный и терпеливый характер и честно сообщает, что является ИИ, а не человеком."}, {"t": "2. Возраст и регистрация", "p": "Регистрация доступна с 13 лет. Если тебе 13–17, там, где этого требует закон, нужно согласие родителя или законного представителя. Мы спрашиваем только возраст в полных годах — дату рождения не просим. Указывать неверный возраст и обходить ограничения нельзя.", "o": "Регистрация доступна пользователям с 13 лет. Пользователям от 13 до 17 лет необходимо получить согласие родителя или законного представителя в случаях, когда этого требует применимое законодательство. Возраст указывается в полных годах; полная дата рождения для этой цели не запрашивается. Нельзя указывать заведомо неверный возраст или обходить возрастные ограничения."}, {"t": "3. Аккаунт и способы входа", "p": "Чтобы прогресс сохранялся, нужен аккаунт. В гостевом режиме могут быть ограничения, а перенос данных между устройствами не гарантируется. Войти можно по почте, через Google и другими способами из приложения. За безопасность своих данных для входа отвечаешь ты.", "o": "Для полноценного обучения и сохранения прогресса требуется аккаунт. Гостевой режим может иметь ограничения и не гарантирует сохранение данных между устройствами. Доступные способы входа могут включать электронную почту, Google и другие предложенные в приложении способы. Пользователь отвечает за безопасность своих средств авторизации."}, {"t": "4. Профиль и изменения данных", "p": "Имя ты меняешь сам в настройках профиля. Возраст и email меняются через поддержку в Telegram. Для этого могут попросить разумное подтверждение, но пароли при этом не запрашиваются.", "o": "Имя можно изменить самостоятельно в настройках профиля. Изменение возраста и адреса электронной почты запрашивается через поддержку Cloudy English в Telegram. Администрация может попросить разумное подтверждение права на изменение данных, не запрашивая пароли."}, {"t": "5. Использование аккаунта", "p": "Сервис создан прежде всего для личной учёбы. Нельзя перепродавать доступ, оказывать с его помощью платные услуги или использовать его массово в организации без письменного разрешения администрации. Внутри семьи аккаунтом пользоваться можно — если это безопасно и не нарушает чужие права.", "o": "Сервис предназначен прежде всего для личного обучения. Коммерческое использование, перепродажа доступа, предоставление сервиса как платной услуги или массовое использование организациями без письменного разрешения администрации не допускаются. Совместное использование аккаунта внутри семьи допускается при соблюдении безопасности и прав других пользователей."}, {"t": "6. Внешние инструменты", "p": "Встроенные инструменты Cloudy нужны, чтобы выполнять задания внутри платформы. Не заменяй этапы обучения сторонними переводчиками или ИИ — так теряется смысл тренировки. Вне Cloudy можешь пользоваться любыми приложениями.", "o": "Встроенные учебные инструменты Cloudy предназначены для выполнения заданий внутри платформы. Не следует подменять ими предусмотренные приложением этапы обучения с помощью сторонних переводчиков или ИИ. Это правило не ограничивает использование пользователем других приложений вне Cloudy English Academy."}, {"t": "7. Пользовательские материалы и интеллектуальная собственность", "p": "Твои материалы остаются твоими. Платформа вправе обрабатывать их только в объёме, нужном для работы функций, и пока ты пользуешься сервисом. Бренд, интерфейс, логотип, персонаж Cloudy и учебные материалы принадлежат правообладателям. Твои фото, переписки и достижения в рекламе — только с отдельного согласия.", "o": "Пользователь сохраняет права на созданные им материалы, если иное не следует из закона или прав третьих лиц. Пользователь предоставляет платформе ограниченное разрешение обрабатывать такие материалы только в объёме, необходимом для работы выбранных функций и пока пользователь пользуется сервисом. Бренд, интерфейс, логотип, персонаж Cloudy и оригинальные материалы платформы принадлежат их соответствующим правообладателям. Использование пользовательских фотографий, переписок, достижений или иных личных материалов в рекламе допускается только при отдельном согласии."}, {"t": "8. Публичность и поведение", "p": "Профиль закрыт по умолчанию, открывать его или нет — решаешь ты. Почта, личные переписки и другие личные сведения публичными не становятся. Запрещены травля, угрозы, незаконные действия, попытки взлома, вмешательство в работу сервиса и публикация чужих персональных данных.", "o": "Профиль закрыт по умолчанию. Пользователь сам решает, включать ли доступную публичность. Электронная почта, личные переписки и иные личные сведения не становятся публичными. Запрещены травля, угрозы, незаконные действия, попытки взлома, вмешательство в работу сервиса и публикация чужих персональных данных."}, {"t": "9. Модерация и обжалование", "p": "За нарушения могут удалить материал, вынести предупреждение, ограничить отдельные функции, временно заблокировать или прекратить доступ к аккаунту. Мера зависит от серьёзности нарушения и закона. Решение можно обжаловать через поддержку в Telegram — туда же принимаются жалобы на публичные профили.", "o": "При нарушении правил администрация может удалить публичный материал, вынести предупреждение, ограничить отдельные функции, временно заблокировать или прекратить доступ к аккаунту. Мера выбирается с учётом характера нарушения и применимого права. Пользователь может обжаловать решение через Telegram-поддержку. Жалобы на публичные профили также принимаются через поддержку."}, {"t": "10. Доступность, прогресс и прекращение аккаунта", "p": "Мы стараемся сохранять и синхронизировать прогресс, но возможны сбои, задержки, потеря данных и временная недоступность. Обычные уведомления приходят только с учётом разрешений устройства и твоих настроек; обязательные юридические сообщения и критические уведомления безопасности могут отправляться способом, предусмотренным законом. Это не отменяет ответственность, которую закон ограничить не позволяет. Временно «заморозить» аккаунт нельзя. Для полного удаления отправь запрос в поддержку: оно выполняется с учётом обязательных сроков хранения, резервных копий и закона.", "o": "Администрация стремится сохранять и синхронизировать учебный прогресс, однако возможны сбои, задержки синхронизации, потеря данных и временная недоступность. Обычные push-уведомления отправляются с учётом разрешений устройства и настроек пользователя; при отключённых уведомлениях они не используются для обычных напоминаний. Обязательные юридические сообщения и критические уведомления безопасности могут направляться предусмотренным законом способом. Это условие не исключает ответственность, которую нельзя ограничить законом. Временная деактивация аккаунта не предусмотрена. Запрос на полное удаление аккаунта направляется через поддержку; удаление выполняется с учётом обязательных сроков хранения, резервных копий и требований закона."}, {"t": "11. Изменения и прекращение работы", "p": "Платформа и документы могут обновляться. О существенных изменениях предупредим заранее, когда это возможно. В чрезвычайных обстоятельствах работа сервиса может быть временно приостановлена или прекращена, при этом обязательные права пользователя сохраняются.", "o": "Администрация может обновлять платформу и настоящие документы. О существенных изменениях пользователи уведомляются заранее, когда это практически возможно. В чрезвычайных обстоятельствах работа сервиса может быть временно приостановлена или прекращена; обязательные права пользователя при этом сохраняются."}, {"t": "12. Контакты и применимое право", "p": "По вопросам аккаунта, жалоб, смены возраста или email и удаления аккаунта пиши в официальную поддержку Cloudy English в Telegram: https://t.me/cloudysupportt_bot.", "o": "По вопросам аккаунта, жалоб, изменения возраста или email и удаления аккаунта обращайтесь в официальную поддержку Cloudy English в Telegram: https://t.me/cloudysupportt_bot."}, {"t": "13. Доступность сервиса по странам", "p": "Сервис международный, но доступен не везде. Это зависит от закона и от того, доступны ли технические поставщики платформы (хостинг, база данных, вход, ИИ). Некоторые страны и территории могут быть закрыты, а доступность может временно меняться из-за провайдеров, санкционных и экспортных требований или блокировок сетей. Определение страны по IP — лишь техническая оценка и может быть неточным. Упоминание региона в рекламе не гарантирует доступ.", "o": "Cloudy English Academy предназначен для международного использования и может быть доступен в странах, где доступны используемые платформой хостинг, база данных, авторизация и ИИ-поставщики, а также где использование сервиса не запрещено применимым законодательством и условиями этих поставщиков. Доступ предоставляется в странах, где доступны необходимые технические поставщики и где использование сервиса не ограничено применимым законодательством или условиями этих поставщиков. Страны и территории, не входящие в актуальный список доступности, могут быть заблокированы. Доступность не гарантируется для каждой страны и может временно различаться из-за ограничений интернет-провайдеров, санкционных и экспортных требований, блокировок сетей, технической доступности поставщиков или требований местного законодательства. Отдельные территории и пользователи могут быть ограничены независимо от страны проживания, если этого требуют применимые нормы или условия поставщиков. Географическое определение по IP является технической оценкой и может быть неточным. Администрация может ограничить доступ из конкретного региона, если это необходимо для соблюдения закона, требований поставщиков или защиты сервиса. Актуальную возможность доступа следует проверять при подключении к сервису; перечисление региона в рекламных или информационных материалах не является гарантией доступности."}]}, {"id": "privacy", "icon": "🔒", "hue": "#7fe0b8", "title": "Политика конфиденциальности", "desc": "Какие данные обрабатываются, зачем и с кем могут передаваться", "short": ["Дату рождения не просим — только возраст в полных годах", "Переписки идут на улучшение ИИ только с твоего отдельного согласия", "Профиль закрыт, пока ты сам его не откроешь", "Можно запросить доступ, исправление, экспорт или удаление данных", "Для работы функций данные получают технические поставщики"], "secs": [{"t": "1. Кто отвечает за обработку", "p": "За работу Cloudy English Academy и обработку данных отвечает Администрация Cloudy English Academy. Вопросы о персональных данных можно задать в официальную поддержку.", "o": "За работу Cloudy English Academy и обработку данных отвечает Администрация Cloudy English Academy. По вопросам обработки персональных данных можно обратиться в официальную поддержку."}, {"t": "2. Какие данные могут обрабатываться", "p": "Зависит от того, чем ты пользуешься. Это может быть: почта и технический ID аккаунта; имя и возраст в годах; выбранный уровень английского; ответы, результаты тестов, ошибки, уроки, XP, достижения и прогресс; сообщения и контекст диалогов с Cloudy AI; настройки; технические данные об устройстве, браузере и подключении, журналы ошибок. Полная дата рождения не запрашивается.", "o": "В зависимости от использования сервиса это могут быть: адрес электронной почты и технический идентификатор аккаунта; имя и возраст в полных годах; выбранный уровень английского; ответы, результаты тестов, ошибки, уроки, XP, достижения и прогресс; сообщения и контекст диалогов с Cloudy AI; сведения о настройках; технические данные устройства, браузера, подключения и журналы ошибок. Полная дата рождения не запрашивается для указания возраста."}, {"t": "3. Для чего используются данные", "p": "Чтобы создать и защитить аккаунт, давать уроки и упражнения, сохранять и синхронизировать прогресс, подбирать сложность, разбирать ошибки, обеспечивать работу Cloudy AI, помогать в поддержке, находить технические проблемы, предотвращать злоупотребления и выполнять требования закона.", "o": "Данные необходимы для регистрации и защиты аккаунта, предоставления уроков и упражнений, сохранения и синхронизации прогресса, персонализации сложности, анализа учебных ошибок, работы Cloudy AI, поддержки, диагностики технических проблем, предотвращения злоупотреблений и выполнения юридических обязанностей."}, {"t": "4. Cloudy AI и внешняя инфраструктура", "p": "Cloudy AI — собственный помощник платформы. Он разбирает ответы и ошибки, подбирает упражнения, проверяет задания, учитывает историю обучения и может сам начать разговор или предложить продолжить урок — отвечать на это необязательно. Для вычислений платформа может использовать внешних технических поставщиков и модели; они не становятся владельцами бренда Cloudy AI. В ИИ-запрос передаётся тот контекст, который нужен для ответа. Внешние пуш-уведомления зависят от разрешений устройства и твоих настроек.", "o": "Cloudy AI — собственный фирменный интеллектуальный помощник Cloudy English Academy. Он может анализировать ответы и ошибки, подбирать упражнения, проверять задания, учитывать историю обучения и инициировать разговор или предлагать продолжить урок. Инициативные сообщения не означают, что пользователь обязан отвечать. Внешние push-уведомления зависят от разрешений устройства и настроек пользователя. Для вычислений и формирования ответов платформа может использовать внешних технических поставщиков и модели. Такие поставщики не становятся владельцами бренда Cloudy AI. В ИИ-запросы передаётся контекст, необходимый для ответа и работы выбранной функции."}, {"t": "5. Использование переписок для улучшения ИИ", "p": "Переписки нужны, чтобы Cloudy AI отвечал тебе и работали учебные функции. Использовать их для дополнительного обучения или улучшения ИИ-моделей можно только с отдельного добровольного согласия. Если откажешься — Cloudy AI продолжит работать как обычно.", "o": "Переписки и сообщения используются для формирования ответов Cloudy AI и предоставления учебных функций. Использование этих данных для дополнительного обучения или улучшения ИИ-моделей допускается только при наличии отдельного добровольного согласия. Отказ от такого согласия не ограничивает обычную работу Cloudy AI."}, {"t": "6. Голосовые функции", "p": "Распознавание и озвучка речи могут использовать встроенные средства устройства или браузера, а также внешние технические сервисы. Как именно обрабатывается звук, зависит от устройства и выбранной функции.", "o": "Функции распознавания и озвучивания речи могут использовать встроенные средства устройства или браузера, а также внешние технические сервисы. Обработка аудио зависит от выбранного устройства и используемой функции."}, {"t": "7. Хранение, безопасность и удаление", "p": "Данные хранятся, пока они нужны для работы аккаунта, функций и обязательных требований. После запроса на удаление их удаляют или обезличивают. Резервные копии и сведения, которые по закону нужно хранить, могут сохраняться дольше.", "o": "Данные хранятся столько, сколько необходимо для работы аккаунта, предоставления функций и выполнения обязательных требований. После запроса на удаление аккаунта данные удаляются или обезличиваются; резервные копии и сведения, которые требуется хранить по закону, могут сохраняться дольше."}, {"t": "8. Передача данных", "p": "Данные могут получать поставщики входа, хостинга, базы данных, ИИ-инфраструктуры и технической поддержки — в объёме, нужном для конкретной функции. При входе через Google и другие внешние сервисы действуют и правила этих сервисов.", "o": "Данные могут передаваться поставщикам авторизации, хостинга, базы данных, ИИ-инфраструктуры и технической поддержки в объёме, необходимом для работы соответствующей функции. При входе через Google и другие внешние сервисы также применяются правила этих провайдеров."}, {"t": "9. Публичные сведения", "p": "Профили закрыты по умолчанию, и открыть профиль может только сам пользователь. Почта, личные переписки и другие личные данные в открытый профиль не попадают. Использовать твои данные, фото, сообщения или достижения в рекламе можно только с отдельного согласия.", "o": "Профили закрыты по умолчанию. Только пользователь может включить доступную публичность. Электронная почта, личные переписки и другие личные данные не публикуются как часть открытого профиля. Использование пользовательских данных, фотографий, сообщений или достижений для рекламы требует отдельного согласия."}, {"t": "10. Права пользователя и обращения", "p": "В зависимости от закона твоей страны ты можешь запросить доступ к данным, их исправление, экспорт, ограничение обработки или удаление, а также отозвать согласие. Запросы отправляются в поддержку в Telegram. Чтобы защитить аккаунт, администрация может проверить личность и право действовать от имени несовершеннолетнего.", "o": "В зависимости от применимого законодательства пользователь может запросить доступ к данным, исправление, экспорт, ограничение обработки или удаление, а также отозвать согласие. Запросы направляются в официальную поддержку Cloudy English через Telegram. Для защиты аккаунта администрация может проверить личность и право заявителя действовать от имени несовершеннолетнего."}, {"t": "11. Несовершеннолетние", "p": "Минимальный возраст регистрации — 13 лет. Для пользователей 13–17 лет согласие родителя или законного представителя запрашивается там, где этого требует закон.", "o": "Минимальный возраст регистрации — 13 лет. Для пользователей 13–17 лет согласие родителя или законного представителя запрашивается там, где оно требуется применимым законом. "}, {"t": "12. Обновления политики", "p": "О существенных изменениях политики сообщим заранее, когда это возможно. В документе должна быть актуальная дата редакции. Вопросы о конфиденциальности — в поддержку в Telegram.", "o": "О существенных изменениях политики сообщается заранее, когда это возможно. В документе должна отображаться актуальная дата редакции. Вопросы по конфиденциальности: официальную поддержку Cloudy English через Telegram."}]}, {"id": "consent", "icon": "✅", "hue": "#ffd35a", "title": "Согласие на обработку персональных данных", "desc": "Объяснение целей обработки и отдельного согласия на улучшение ИИ", "short": ["Основные данные нужны, чтобы сервис вообще работал", "Улучшение ИИ на твоих диалогах — отдельная необязательная галочка", "Галочка не включена заранее", "Согласие можно отозвать простым способом", "Отказ не ограничивает обучение и Cloudy AI"], "secs": [{"t": "1. Основная обработка для работы сервиса", "p": "Чтобы создать аккаунт, войти, сохранять прогресс, давать уроки, помогать в поддержке и защищать платформу, Cloudy English Academy обрабатывает необходимые данные на законных основаниях.", "o": "Для создания аккаунта, входа, сохранения прогресса, предоставления уроков, поддержки и защиты платформы Cloudy English Academy обрабатывает необходимые данные пользователя на соответствующих законных основаниях. "}, {"t": "2. Отдельное согласие на дополнительное использование диалогов", "p": "Использование сообщений и переписок для улучшения или обучения ИИ — отдельная необязательная цель. Для неё нужно активное согласие: твоё или родителя/представителя, когда этого требует закон. Отметка не должна быть включена заранее. Отказ не ограничивает обычное обучение и работу Cloudy AI.", "o": "Использование сообщений и переписок для улучшения или обучения ИИ — отдельная необязательная цель. Для неё требуется отдельное активное согласие пользователя или родителя/представителя, когда это предусмотрено законом. Отметка не должна быть включена заранее. Отказ не должен ограничивать обычное обучение и работу Cloudy AI."}, {"t": "3. Отзыв согласия", "p": "Дополнительное согласие должно быть легко отозвать. После отзыва новое дополнительное использование данных прекращается; уже выполненные операции и резервные копии обрабатываются по закону и в технически обоснованные сроки.", "o": "Пользователь должен иметь возможность отозвать дополнительное согласие простым способом. После отзыва новое дополнительное использование данных прекращается; уже выполненные операции и резервные копии обрабатываются согласно применимому законодательству и технически обоснованным срокам."}, {"t": "4. Несовершеннолетние", "p": "Если для обработки нужно согласие родителя или законного представителя, его получают и подтверждают способом, соответствующим закону. Одного указания возраста недостаточно, когда проверка полномочий представителя обязательна.", "o": "Если для обработки требуется согласие родителя или законного представителя, оно должно быть получено и подтверждено способом, соответствующим применимому праву. Само указание возраста не заменяет проверку полномочий представителя, когда такая проверка обязательна."}]}, {"id": "community", "icon": "🤝", "hue": "#ff9aab", "title": "Правила сообщества", "desc": "Безопасность, уважение и модерация", "short": ["Общайся уважительно: без травли, угроз и оскорблений", "Не публикуй пароли, адреса, документы и чужие данные", "Профиль закрыт по умолчанию — публичность на тебе", "Ответы ИИ могут быть неточными", "О нарушениях сообщай в поддержку в Telegram"], "secs": [{"t": "1. Уважительное общение", "p": "Запрещены травля, угрозы, преследование, унижение, оскорбления, дискриминация и намеренное запугивание других пользователей.", "o": "Запрещены травля, угрозы, преследование, унижение, оскорбления, дискриминация и намеренное запугивание других пользователей."}, {"t": "2. Защита личной информации", "p": "Не публикуй пароли, домашние адреса, номера документов, финансовые сведения, личные контакты и чужие персональные данные. И не проси других раскрывать такое.", "o": "Не публикуйте пароли, домашние адреса, номера документов, финансовые сведения, личные контакты и чужие персональные данные. Не просите других пользователей раскрывать такую информацию."}, {"t": "3. Публичные профили и материалы", "p": "Профили закрыты по умолчанию. Если ты включаешь публичность, ты отвечаешь за то, что решил показать. Администрация может удалить публичный профиль или материал, который нарушает правила, закон или безопасность пользователей.", "o": "Профили закрыты по умолчанию. Включая публичность, пользователь отвечает за выбранные к публикации сведения. Администрация может удалить публичный профиль или материал, нарушающий правила, закон или безопасность пользователей."}, {"t": "4. Учебная честность и безопасность сервиса", "p": "Пользуйся платформой для учёбы. Запрещены попытки взлома и обхода ограничений, вмешательство в чужой прогресс, распространение вредоносного кода и использование сервиса для незаконных действий.", "o": "Используйте платформу для обучения. Запрещены попытки взлома, обхода ограничений, вмешательства в прогресс других пользователей, распространение вредоносного кода и использование сервиса для незаконных действий."}, {"t": "5. Cloudy AI", "p": "Cloudy AI — собственный образовательный помощник платформы: общается по-русски, помогает учить английский и отвечает на вопросы о Cloudy English Academy. На посторонние запросы может отказать. Его ответы могут быть неточными и не заменяют консультацию специалиста.", "o": "Cloudy AI — собственный образовательный помощник платформы. Он предназначен для общения на русском языке, изучения английского и ответов на вопросы о Cloudy English Academy. Он может отказывать в посторонних запросах. Ответы ИИ могут быть неточными и не являются профессиональной консультацией."}, {"t": "6. Жалобы и меры", "p": "О нарушении в публичном профиле или другом инциденте пиши в поддержку в Telegram. Администрация может запросить уточнения, удалить материал, вынести предупреждение, ограничить функции или заблокировать аккаунт. Решение можно обжаловать там же.", "o": "О нарушении публичного профиля или другом инциденте сообщайте в официальную поддержку Cloudy English через Telegram. Администрация может запросить уточнения, удалить материал, вынести предупреждение, ограничить функции или заблокировать аккаунт. Решение можно обжаловать через ту же поддержку."}]}, {"id": "payments", "icon": "💳", "hue": "#b58cff", "title": "Оплата и возвраты", "desc": "Правила для платных функций без выдуманных условий", "short": ["Цена, валюта, состав и срок показываются до оплаты", "Возвраты рассматриваются по закону и правилам платёжного провайдера", "Права потребителя сохраняются", "В поддержку не присылай пароли, данные карт и коды"], "secs": [{"t": "1. Информация о платных функциях", "p": "Если платные функции есть, до подтверждения оплаты тебе ясно покажут цену, валюту, что входит в услугу и на какой срок она доступна. Сам const sentenceMark = (ru) => {
  const last = ru.trimEnd().slice(-1);
  return /[.!?…]/.test(last) ? last : ".";
};
for (const lesson of D) {
  lesson.s = lesson.s.map(([ru, en, distractors]) => {
    const mark = sentenceMark(ru);
    return [/[.!?…]$/.test(ru.trim()) ? ru : ru + mark, /[.!?…]$/.test(en.trim()) ? en : en + mark, distractors];
  });
}

(function (global) {
  "use strict";

  function normalizeSpeechText(value){
   return String(value||"").normalize("NFKD").toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
  }
  function speechDistance(a,b){
   const prev=Array.from({length:b.length+1},(_,i)=>i);
   for(let i=1;i<=a.length;i++){let diagonal=prev[0];prev[0]=i;for(let j=1;j<=b.length;j++){const above=prev[j];prev[j]=Math.min(prev[j]+1,prev[j-1]+1,diagonal+(a[i-1]===b[j-1]?0:1));diagonal=above;}}
   return prev[b.length];
  }
  function speechMatches(transcript,target){
   const heard=normalizeSpeechText(transcript),expected=normalizeSpeechText(target);
   if(!heard||!expected)return false;
   // Short English words often differ by a single phoneme (son/sun, ship/sheep).
   // Browser ASR's fuzzy transcript matching cannot safely distinguish them.
   if(heard===expected)return true;
   if(expected.includes(" "))return false;
   if(expected.length<5)return false;
   return Math.abs(heard.length-expected.length)<=1&&speechDistance(heard,expected)<=1;
  }

  global.CloudySpeech = Object.freeze({ normalizeSpeechText, speechDistance, speechMatches });
})(window);

 const mimeType=String(file.type||fallbackMime).toLowerCase();
 const allowed=image?["image/jpeg","image/png","image/webp"]:["video/mp4","video/webm","video/quicktime"];
 const maxBytes=image?15*1024*1024:100*1024*1024;
 if(!allowed.includes(mimeType))throw new Error(image?"Поддерживаются JPG, PNG и WebP.":"Поддерживаются MP4, MOV и WebM.");
 if(file.size>maxBytes)throw new Error(image?"Фотография должна быть не больше 15 МБ.":"Видео должно быть не больше 100 МБ.");
 const progress=value=>{try{const frame=shortsFlowFrame?.contentWindow;if(typeof frame?.cloudyPublishProgress==="function")frame.cloudyPublishProgress(value);}catch(_){}};
 progress(3);
 const started=await authRequest("shorts-upload-start",{payload:{
  mediaType:image?"image":"video",
  fileName:String(file.name|| (image?"cloudy-short.jpg":"cloudy-short.mp4")).slice(0,180),
  mimeType,sizeBytes:file.size,caption,
  durationSeconds:image?0:Math.max(0,Math.round(Number(detail?.durationSeconds||detail?.duration||0)))
 }});
 const ticket=started?.result;
 if(!ticket?.signedUrl||!ticket?.publishableKey||!ticket?.contentUrl||!ticket?.videoId||!ticket?.token)throw new Error("Сервер не подготовил защищённую загрузку.");
 progress(12);
 const uploadUrl=new URL(ticket.signedUrl,ticket.contentUrl).toString();
 const body=new FormData();body.append("cacheControl","3600");body.append("",file);
 const response=await fetch(uploadUrl,{method:"PUT",headers:{apikey:ticket.publishableKey,Authorization:"Bearer "+ticket.publishableKey,"x-upsert":"false"},body});
 if(!response.ok){let message="";try{message=(await response.json()).message||"";}catch(_){}throw new Error(message||"Не удалось загрузить файл в защищённое хранилище.");}
 progress(78);
 const finalized=await authRequest(image?"shorts-upload-image-finalize":"shorts-upload-finalize",{payload:{videoId:ticket.videoId}});
 if(!finalized?.result?.ok)throw new Error("Не удалось завершить публикацию.");
 progress(100);
 try{await shortsLoadFeed(true);}catch(feedError){console.warn("[cloudy-shorts] feed refresh after publish failed",feedError);}
 try{const frame=shortsFlowFrame?.contentWindow;if(typeof frame?.cloudyPublishDone==="function")frame.cloudyPublishDone(finalized.result);}catch(_){}
 toast(finalized.result.published?(image?"Фотография опубликована в Shorts!":"Видео опубликовано в Shorts!"):"Публикация отправлена на проверку Cloudy AI.");
 return finalized.result;
}
